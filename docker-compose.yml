services:

  chat-api:
    build: ./backend
    container_name: chat-api
    ports:
      - "3000:3000"
    networks:
      - devopsgpt-net
    depends_on:
      - cache

  chat-ui:
    build: ./frontend
    container_name: chat-ui
    ports:
      - "5173:5173"
    networks:
      - devopsgpt-net
    depends_on:
      - chat-api

  cache:
    image: redis:7-alpine
    container_name: cache
    ports:
      - "6379:6379"
    networks:
      - devopsgpt-net

networks:
  devopsgpt-net:
    driver: bridge
